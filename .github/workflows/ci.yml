name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --log-opts="--all" /repo

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.14']
        exclude:
          - os: macos-latest
            python-version: '3.8'
          - os: ubuntu-latest
            python-version: '3.8'
        include:
          - os: ubuntu-24.04
            python-version: '3.8'
    # Keep the required macOS check name while using the Intel runner pool.
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-15-intel' || matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Check CLI entry points
        shell: bash
        run: |
          agent-auto-approve --help
          agent-auto-approve install --help
          agent-auto-approve launch --help
          agent-auto-approve uninstall --help
      - name: Test hook registration and workspace scope
        run: python -m unittest discover -s tests
