[metadata]
name = agent-auto-approve
version = 0.1.2
description = Manage approval hooks for Codex, Claude Code, and Antigravity CLI.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/jiind/agent-auto-approve
project_urls =
    Issues = https://github.com/jiind/agent-auto-approve/issues

[options]
py_modules = codex_approval_hook
python_requires = >=3.8
install_requires =
    websockets>=13.1

[options.entry_points]
console_scripts =
    agent-auto-approve = codex_approval_hook:cli
